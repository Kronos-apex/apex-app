<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVI · Prueba de Auth + RLS (DEV)</title>
<!-- ⚠️ ARCHIVO DE PRUEBA — solo para verificar Supabase Auth + RLS en localhost.
     NO forma parte de la app de producción y NUNCA se mergea a main. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:620px;margin:0 auto;padding:20px;background:#0c1410;color:#e8f5ee;line-height:1.5}
  h1{font-size:18px;color:#10E0A0}
  h2{font-size:14px;color:#10E0A0;margin-top:26px;border-top:1px solid #1d3a2c;padding-top:16px}
  input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;background:#13231b;border:1px solid #234;border-radius:8px;color:#fff;font-size:14px}
  button{padding:10px 14px;margin:4px 4px 4px 0;background:#10E0A0;color:#06231a;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
  button.ghost{background:#1d3a2c;color:#9fe}
  pre{background:#0a0f0c;border:1px solid #1d3a2c;border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:280px;overflow:auto}
  .status{padding:8px 12px;border-radius:8px;background:#13231b;font-size:13px;margin:8px 0}
  .ok{color:#10E0A0}.err{color:#ff8a8a}.muted{color:#7fb39e;font-size:12px}
</style>
</head>
<body>
<h1>🔐 AVI · Prueba de Auth + RLS</h1>
<p class="muted">Verifica que Supabase Auth y el aislamiento por RLS de <code>user_data</code> funcionan,
antes de reescribir el login real. Esta página no toca la app ni los datos en vivo.</p>

<div class="status" id="session">Sesión: <span class="muted">cargando…</span></div>

<h2>1 · Cuenta (email + contraseña)</h2>
<input id="email" type="email" placeholder="correo de prueba (ej. test1@avi.test)" autocomplete="off">
<input id="pass" type="password" placeholder="contraseña (mín. 6)" autocomplete="off">
<div>
  <button onclick="doSignUp()">Crear cuenta</button>
  <button onclick="doSignIn()">Entrar</button>
  <button class="ghost" onclick="doGoogle()">Entrar con Google</button>
  <button class="ghost" onclick="doSignOut()">Salir</button>
</div>

<h2>2 · Mi fila en user_data (prueba RLS)</h2>
<input id="profileName" placeholder="nombre a guardar en mi perfil">
<div>
  <button onclick="saveRow()">Guardar mi fila</button>
  <button onclick="loadRow()">Cargar mi fila</button>
  <button class="ghost" onclick="loadAll()">Intentar leer TODAS las filas (debe devolver solo la mía)</button>
</div>
<pre id="out">—</pre>

<script>
const SB_URL='https://eoebhrxbokyllqalyecj.supabase.co';
const SB_KEY='sb_publishable_hKjgo84b9Lews5oq90b9Fg_1pue73W8';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'avi_authtest'}});

const $=id=>document.getElementById(id);
function out(label,data,isErr){
  $('out').textContent=label+'\n'+(typeof data==='string'?data:JSON.stringify(data,null,2));
  $('out').className=isErr?'err':'ok';
}
async function refreshSession(){
  const {data}=await sb.auth.getSession();
  const s=data&&data.session;
  $('session').innerHTML = s
    ? 'Sesión: <span class="ok">'+ (s.user.email||s.user.id) +'</span> <span class="muted">(uid '+s.user.id.slice(0,8)+'…)</span>'
    : 'Sesión: <span class="muted">sin sesión</span>';
}
sb.auth.onAuthStateChange(()=>refreshSession());
refreshSession();

async function doSignUp(){
  const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('pass').value});
  if(error)return out('❌ Error al crear cuenta',error.message,true);
  out('✅ Cuenta creada. Si pide confirmar email, desactiva "Confirm email" en Supabase para probar.',data.user||data);
  refreshSession();
}
async function doSignIn(){
  const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  if(error)return out('❌ Error al entrar',error.message,true);
  out('✅ Sesión iniciada',data.user.email);
  refreshSession();
}
async function doGoogle(){
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});
  if(error)out('❌ Error Google',error.message,true);
}
async function doSignOut(){ await sb.auth.signOut(); out('Sesión cerrada','—'); refreshSession(); }

async function myUid(){ const {data}=await sb.auth.getSession(); return data&&data.session&&data.session.user.id; }

async function saveRow(){
  const uid=await myUid(); if(!uid)return out('❌','Inicia sesión primero',true);
  const {data,error}=await sb.from('user_data').upsert({
    user_id:uid, role:'client', profile:{name:$('profileName').value||'(sin nombre)', test:true},
    updated_at:new Date().toISOString()
  }).select();
  if(error)return out('❌ Error al guardar (RLS?)',error.message,true);
  out('✅ Fila guardada (RLS dejó escribir SOLO mi user_id)',data);
}
async function loadRow(){
  const uid=await myUid(); if(!uid)return out('❌','Inicia sesión primero',true);
  const {data,error}=await sb.from('user_data').select('*').eq('user_id',uid);
  if(error)return out('❌ Error al leer',error.message,true);
  out('Mi fila:',data);
}
async function loadAll(){
  // Sin filtro: RLS debe limitar a las filas que YO puedo ver (la mía / mis clientes).
  const {data,error}=await sb.from('user_data').select('*');
  if(error)return out('❌ Error',error.message,true);
  out('Filas visibles para mí (deben ser solo las permitidas por RLS — '+data.length+'):',data);
}
</script>
</body>
</html>

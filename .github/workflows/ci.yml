# CI de AVI — corre el MISMO audit que el pre-commit hook en cada push/PR.
# Red de seguridad para pushes desde otra máquina o commits con --no-verify:
# el hook local puede saltarse; esto no.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Suite de negocio (avi.test.js)
        run: node avi.test.js
      - name: Audit completo (mismo script que el pre-commit hook)
        run: python3 scripts/hooks/pre-commit

  # 11-oct-2026: kronos-apex.github.io dejó de servir la app (decisión del PO). GitHub Pages publica la
  # rama `pages-mudanza` (la página «AVI se mudó»), no main, así que un push a main NO publica nada: la app
  # vive solo en app.avientrena.com y se publica con `node scripts/publicar-hogar.mjs`. Este paso espera
  # hasta 20 minutos a que ese hogar sirva la versión de este commit (o una más nueva) — un arreglo que se
  # queda en el repo no le llega a nadie (ya pasó en v659) — y comprueba que la dirección vieja siga
  # mostrando la página de mudanza y no una copia de la app. Si no, ROJO y llega el correo.
  # Un push más nuevo cancela la espera del anterior (no es un fallo: la nueva espera lo cubre).
  produccion:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: produccion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: app.avientrena.com sirve la versión de este commit y la dirección vieja sigue apagada
        run: |
          num() { echo "$1" | grep -o '[0-9]*$'; }
          V=$(grep -o 'avi-v[0-9]*' sw.js | head -1)
          echo "Versión de este commit: $V"
          OK=
          for i in $(seq 1 40); do
            B=$(curl -s "https://app.avientrena.com/sw.js?nc=$i$RANDOM" | grep -o 'avi-v[0-9]*' | head -1)
            echo "intento $i · app.avientrena.com=$B"
            if [ -n "$B" ] && [ "$(num "$B")" -ge "$(num "$V")" ]; then OK=1; break; fi
            sleep 30
          done
          if [ -z "$OK" ]; then
            echo "::error::Tras 20 minutos app.avientrena.com no sirve $V (sirve $B). Publícalo: node scripts/publicar-hogar.mjs"
            exit 1
          fi
          echo "✅ app.avientrena.com sirve $B"
          P=$(curl -s "https://kronos-apex.github.io/apex-app/?nc=$RANDOM")
          if ! echo "$P" | grep -q 'AVI se mudó'; then
            echo "::error::kronos-apex.github.io ya no muestra la página «AVI se mudó» (¿cambió la fuente de GitHub Pages?)"
            exit 1
          fi
          S=$(curl -s "https://kronos-apex.github.io/apex-app/sw.js?nc=$RANDOM")
          if echo "$S" | grep -q 'avi-v[0-9]'; then
            echo "::error::kronos-apex.github.io vuelve a servir el service worker de la app"
            exit 1
          fi
          echo "✅ kronos-apex.github.io sigue mostrando la página de mudanza"

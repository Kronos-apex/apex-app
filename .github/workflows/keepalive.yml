name: Supabase keepalive

# Evita la auto-pausa del proyecto Supabase free (se pausa tras ~7 días sin
# actividad). Hace un request ligero a la API REST dos veces por semana
# (lunes y jueves), bien dentro de la ventana de 7 días.
#
# La anon/publishable key NO es secreta: ya viaja en el cliente (index.html).
# Por eso va embebida y el workflow no necesita configuración de secretos.

on:
  schedule:
    - cron: '17 12 * * 1,4'   # 12:17 UTC lunes y jueves
  workflow_dispatch:           # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          SB="https://eoebhrxbokyllqalyecj.supabase.co"
          ANON="sb_publishable_hKjgo84b9Lews5oq90b9Fg_1pue73W8"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB/rest/v1/user_data?select=user_id&limit=1" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON")
          echo "Supabase REST respondió: $CODE"
          # 200 (consulta ok, RLS devuelve vacío sin sesión) cuenta como actividad.
          if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
            echo "::error::Respuesta inesperada de Supabase: $CODE"
            exit 1
          fi
